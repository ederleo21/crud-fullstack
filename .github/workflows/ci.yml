name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint frontend
      run: |
        cd frontend
        npm run lint

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install backend dependencies
      run: |
        cd institucion
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt

    - name: Run Django checks
      run: |
        cd institucion
        python manage.py check

    - name: Run Django migrations check
      run: |
        cd institucion
        python manage.py makemigrations --dry-run --check

    - name: Generate build report
      run: |
        echo "## Build Report" > build-report.md
        echo "- Frontend build: ✅ Success" >> build-report.md
        echo "- Backend checks: ✅ Passed" >> build-report.md
        echo "- Date: $(date)" >> build-report.md
        cat build-report.md